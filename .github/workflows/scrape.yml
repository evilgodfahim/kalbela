name: Kalbela Opinion RSS

on:
  schedule:
    - cron k bdnews24.com: "0 * * * *"   # every hour on the hour (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        env:
          LOG_LEVEL: info
          TZ: Asia/Dhaka
        options: >-
          --health-cmd "curl -sf http://localhost:8191/health"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12
          --health-start-period 40s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
        run: python kalbela.py

      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add opinion.xml feed_state.json
          if git diff --cached --quiet; then
            echo "No changes 鈥� skipping commit."
          else
            git commit -m "feed: kalbela opinion [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
            git push
          fi