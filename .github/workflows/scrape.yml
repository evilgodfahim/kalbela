name: scrape

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      FLARE_URL: ${{ secrets.FLARE_URL }}
      FLARE_API_KEY: ${{ secrets.FLARE_API_KEY }}
      FLARE_SESSION: ${{ secrets.FLARE_SESSION }}
      FLARE_MAX_TIMEOUT: "60000"
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add opinion.xml world.xml daily.xml print_articles_tracker.json
          git commit -m "update feeds" || echo "no changes"
          git push